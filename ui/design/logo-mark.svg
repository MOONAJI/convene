  <!-- Convene "Lens C" mark — versi untuk latar gelap (default app).
       C (ivory)  = ruang privat: data individual tiap LP tertutup.
       Lensa (emerald) = irisan dua lingkaran: yang dibagi bersama (hasil agregat),
       satu-satunya yang terlihat di celah C.
       Konstruksi: C = cincin R80/r52 berpusat (100,100), celah ±45°.
       Lensa = irisan lingkaran r36 berpusat (132,100) & (164,100); jarak bebas ke C ±10 unit. -->
